<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e9ff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="r" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f5d0fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#g)"/>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#r)"/>
  <!-- subtle noise -->
  <filter id="n" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" type="fractalNoise"/>
    <feColorMatrix type="saturate" values="0.1"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.02"/>
    </feComponentTransfer>
  </filter>
  <rect x="0" y="0" width="100%" height="100%" filter="url(#n)" opacity="0.4"/>
</svg>